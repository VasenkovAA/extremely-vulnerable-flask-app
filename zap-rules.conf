
# Правила OWASP ZAP Baseline
# WARN — фиксировать предупреждения, не блокировать pipeline

10010	WARN	Cookie without HttpOnly
10011	WARN	Cookie without Secure
10015	WARN	Missing cache-control headers
10019	WARN	Missing Content-Type header
10020	WARN	Missing X-Frame-Options
10021	WARN	Missing X-Content-Type-Options
10023	WARN	Debug error messages
10024	WARN	Sensitive information in URL
10025	WARN	Sensitive information in Referer

